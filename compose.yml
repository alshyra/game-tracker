services:
  gameshelf:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: gameshelf:0.1.0
    container_name: gameshelf
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # La prod passe par Authentik : pas d'utilisateur fictif.
      DEV_NO_AUTH: "false"
      PORT: "3000"
      GAMESHELF_ROOT: /data
    volumes:
      - gameshelf-data:/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.services.gameshelf.loadbalancer.server.port=3000
      # UI + lectures publiques (GET/HEAD) — lecture seule, sans Authentik
      - "traefik.http.routers.gameshelf.rule=Host(`gameshelf.alshyra.fr`) && (Method(`GET`) || Method(`HEAD`))"
      - traefik.http.routers.gameshelf.entrypoints=websecure
      - traefik.http.routers.gameshelf.tls.certresolver=ovh
      - traefik.http.routers.gameshelf.priority=10
      # Écritures (POST/PATCH/DELETE/PUT) — forward-auth Authentik (injecte X-authentik-username)
      - "traefik.http.routers.gameshelf-write.rule=Host(`gameshelf.alshyra.fr`) && (Method(`POST`) || Method(`PATCH`) || Method(`DELETE`) || Method(`PUT`))"
      - traefik.http.routers.gameshelf-write.entrypoints=websecure
      - traefik.http.routers.gameshelf-write.tls.certresolver=ovh
      - traefik.http.routers.gameshelf-write.middlewares=auth@file
      - traefik.http.routers.gameshelf-write.service=gameshelf
      - traefik.http.routers.gameshelf-write.priority=30
      # Auth check — protégé par Authentik (forward-auth)
      - "traefik.http.routers.gameshelf-auth.rule=Host(`gameshelf.alshyra.fr`) && PathPrefix(`/api/auth`)"
      - traefik.http.routers.gameshelf-auth.entrypoints=websecure
      - traefik.http.routers.gameshelf-auth.tls.certresolver=ovh
      - traefik.http.routers.gameshelf-auth.middlewares=auth@file
      - traefik.http.routers.gameshelf-auth.service=gameshelf
      - traefik.http.routers.gameshelf-auth.priority=20
      # MCP — jeton bearer, exempté du forward-auth Authentik
      - "traefik.http.routers.gameshelf-mcp.rule=Host(`gameshelf.alshyra.fr`) && PathPrefix(`/mcp`)"
      - traefik.http.routers.gameshelf-mcp.entrypoints=websecure
      - traefik.http.routers.gameshelf-mcp.tls.certresolver=ovh
      - traefik.http.routers.gameshelf-mcp.service=gameshelf
      - traefik.http.routers.gameshelf-mcp.priority=100

volumes:
  gameshelf-data:

networks:
  traefik:
    external: true
